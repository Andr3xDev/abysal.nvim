name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        neovim-version: [stable, nightly]
    steps:
      - uses: actions/checkout@v4
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.neovim-version }}
      - run: ./scripts/test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install selene
        run: |
          curl -sL https://github.com/Kampfkarren/selene/releases/latest/download/selene-light-linux.zip -o selene.zip
          unzip selene.zip selene
          chmod +x selene
          sudo mv selene /usr/local/bin/selene
      - run: selene lua/
      - uses: JohnnyMorganz/stylua-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: latest
          args: --check lua/
